<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Leru Stream</title><style>body{margin:0;background:#0b0b0e;color:#eee;font:17px system-ui;min-height:100vh;display:grid;place-items:center}main{max-width:32rem;padding:2rem}h1{color:#ff7947}a,button{color:#ff9169}button{background:none;border:1px solid;padding:.7rem 1rem;cursor:pointer;border-radius:.5rem}p{line-height:1.6}</style></head><body><main><h1>Leru Stream</h1><p id="status" role="status">Connecting to Leru Stream…</p><p><a id="open" hidden>Open Leru Stream</a></p><button id="retry" hidden>Try again</button><noscript>Enable JavaScript to look up the current Leru Stream address.</noscript></main><script>
const statusText=document.getElementById('status'),openLink=document.getElementById('open'),retry=document.getElementById('retry');
async function connect(){
 retry.hidden=true;statusText.textContent='Connecting to Leru Stream…';
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  let response;try{response=await fetch('https://raw.githubusercontent.com/lerufintech/leru-stream-link/main/target.json?t='+Math.floor(Date.now()/30000),{cache:'no-store',credentials:'omit',signal:controller.signal});}finally{clearTimeout(timer);}
  if(!response.ok)throw Error('unavailable');
  const target=await response.json(),url=new URL(target.url);
  if(url.protocol!=='https:'||!/^([a-z0-9]+-)*[a-z0-9]+\.trycloudflare\.com$/.test(url.hostname)||url.username||url.password||url.port||url.pathname!=='/'||url.search||url.hash)throw Error('invalid destination');
  openLink.href=url.origin;openLink.hidden=false;statusText.textContent='Opening Leru Stream…';location.replace(url.origin);
 }catch{statusText.textContent='We couldn’t look up the current address. Please try again shortly.';retry.hidden=false;}
}
retry.addEventListener('click',connect);connect();
</script></body></html>
